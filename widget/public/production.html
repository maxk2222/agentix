<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Beispiel: Agentix CyberChatbot in Production">
  <meta name="security" content="Content-Security-Policy: default-src 'self'; script-src 'self' https://cdn.example.com; connect-src https://api.openai.com;">
  <title>Production Integration - Agentix CyberChatbot</title>
</head>
<body>
  <!-- Your Website Content -->
  <main>
    <h1>Willkommen auf unserer Website</h1>
    <p>Der Chat-Bot ist in der unteren rechten Ecke verfügbar.</p>
  </main>

  <!-- ============================================
       OPTION 1: CDN Integration (Empfohlen)
       ============================================ -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
  <script src="https://cdn.example.com/agentix-chat/widget.umd.js"></script>
  <script>
    // Production Config
    const chatConfig = {
      // Variante A: Via Backend Proxy (Sicher)
      proxyUrl: 'https://dein-backend.com/api/chat-proxy',
      // Oder
      // Variante B: API Key via Environment (Nur für Entwicklung)
      // apiKey: process.env.REACT_APP_OPENAI_KEY,

      // Weitere Einstellungen
      model: 'CyberSecurityChatbot',
      position: 'bottom-right',
      theme: 'light',
      width: 650,
      height: 550,
      showOnLoad: false,

      // Error Logging
      onError: (error) => {
        // Nur Error-Type loggen, nicht Message-Inhalte!
        if (window.analytics) {
          window.analytics.trackEvent('chat_error', {
            type: error.name,
            message: error.message.substring(0, 50), // Gekürzt
            timestamp: new Date().toISOString()
          });
        }
      },

      // Init Callback
      onInit: () => {
        console.log('Chat Widget initialized');
      }
    };

    // Initialize Widget
    if (window.initAgentixChat) {
      window.initAgentixChat(chatConfig);
    }
  </script>

  <!-- ============================================
       PERFORMANCE MONITORING
       ============================================ -->
  <script>
    // Optional: Performance Monitoring
    if (window.performance && window.performance.mark) {
      // Mark Chat Widget Load
      performance.mark('chat-widget-start');
      
      // After widget loads
      setTimeout(() => {
        performance.mark('chat-widget-end');
        performance.measure(
          'chat-widget',
          'chat-widget-start',
          'chat-widget-end'
        );

        const measure = performance.getEntriesByName('chat-widget')[0];
        if (window.analytics) {
          window.analytics.trackTiming(
            'Chat Widget Load',
            measure.duration
          );
        }
      }, 5000);
    }
  </script>

  <!-- ============================================
       OPTIONAL: Custom Styling
       ============================================ -->
  <style>
    /* Optional: Override widget styles */
    :root {
      --chat-primary: #667eea;
      --chat-secondary: #764ba2;
      --chat-success: #10b981;
      --chat-error: #ef4444;
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      .agentix-chat-widget-container {
        --chat-bg: #1a1a2e;
        --chat-text: #e4e4e7;
      }
    }
  </style>
